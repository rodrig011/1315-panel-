name: mcpanel

services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${MCPANEL_UID}:${MCPANEL_GID}"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      APP_ORIGIN: ${PANEL_ORIGIN}
      PUBLIC_HOST: ${PUBLIC_HOST}
      DATABASE_URL: ${DATABASE_URL}
      DOCKER_HOST: tcp://socket-proxy:2375
      MC_UID: ${MCPANEL_UID}
      MC_GID: ${MCPANEL_GID}
    volumes:
      - /opt/mcpanel/data:/app/data
      - /srv/mcpanel/servers:/srv/mcpanel/servers
      - /var/log/mcpanel/backend:/var/log/mcpanel/backend
    networks:
      - app
      - control
    depends_on:
      socket-proxy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_ORIGIN}
    restart: unless-stopped
    user: "${MCPANEL_UID}:${MCPANEL_GID}"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${API_ORIGIN}
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  caddy:
    build:
      context: ./app/deploy/caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./app/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mcpanel/caddy/data:/data
      - /opt/mcpanel/caddy/config:/config
      - /var/log/mcpanel/caddy:/var/log/mcpanel/caddy
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging

networks:
  app:
    driver: bridge
  control:
    driver: bridge
    internal: true
